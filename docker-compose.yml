services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pricealert
      POSTGRES_USER: ${DATABASE_USERNAME:-pricealert}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d pricealert"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  price-alert-api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/pricealert
      SERVER_ADDRESS: 0.0.0.0
      MERCADO_LIVRE_TOKEN_FILE: /app/oauth/mercadolivre.json
    volumes:
      - oauth-data:/app/oauth
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  oauth-data:
