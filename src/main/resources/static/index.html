  <title>Milizé — Ofertas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #141820; color: #f5f3ff; font-family: system-ui, sans-serif; }
    main { width: min(100%, 600px); padding: clamp(28px, 7vw, 60px); border: 1px solid #363444; border-radius: 24px; background: #1e222d; }
    .label { color: #c4b5fd; font-size: 13px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }

    p { color: #c0c4cf; line-height: 1.7; margin: 0 0 32px; }
    a { display: inline-flex; align-items: center; gap: 24px; padding: 14px 22px; border-radius: 10px; background: #c4b5fd; color: #201738; text-decoration: none; font-weight: 700; }
    a:hover { background: #ddd6fe; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; }
    .secondary { background: transparent; color: #ddd6fe; border: 1px solid #82739c; }
    .secondary:hover { background: #363044; }
    footer { margin-top: 32px; font-size: 13px; color: #a1a7b5; }

</head>

  <main>
