name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests, 100% coverage and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check publishable files for secrets
        run: node scripts/check-secrets.mjs

      - name: Check JavaScript syntax
        run: |
          for script in scripts/*.mjs src/main/resources/static/*.js; do
            node --check "$script"
          done

      - name: Test OAuth helper
        run: node --test scripts/mercadolivre-oauth.test.mjs

      # Maven verify enforces 100% LINE, BRANCH and INSTRUCTION coverage via jacoco:check.
      - name: Checkstyle, Java tests, PostgreSQL integration and 100% coverage gate
        run: sh mvnw --batch-mode --no-transfer-progress -Dpostgres=true clean verify

      - name: Publish coverage summary
        if: ${{ always() && hashFiles('target/site/jacoco/jacoco.xml') != '' }}
        shell: pwsh
        run: |
          [xml]$report = Get-Content target/site/jacoco/jacoco.xml -Raw
          $summary = @(
            '## Java coverage (JaCoCo)', '',
            'Required: **100%** for each metric, enforced by Maven `verify`.', '',
            '| Metric | Covered | Total | Coverage | Required |',
            '| --- | ---: | ---: | ---: | ---: |'
          )
          foreach ($metric in @('LINE', 'BRANCH', 'INSTRUCTION')) {
            $counter = $report.report.counter | Where-Object type -eq $metric
            if ($null -eq $counter) { throw "Missing JaCoCo counter: $metric" }
            $covered = [long]$counter.covered
            $total = $covered + [long]$counter.missed
            $percentage = if ($total -gt 0) { 100 * $covered / $total } else { 0 }
            $formatted = $percentage.ToString('F2', [cultureinfo]::InvariantCulture)
            $summary += "| $metric | $covered | $total | $formatted% | 100% |"
          }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/checkstyle-result.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validated application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: price-alert-bot-${{ github.sha }}
          path: target/price-alert-bot-0.1.0.jar
          if-no-files-found: error
          retention-days: 7
