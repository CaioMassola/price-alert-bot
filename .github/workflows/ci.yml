name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check publishable files for secrets
        run: node scripts/check-secrets.mjs

      - name: Check JavaScript syntax
        run: |
          for script in scripts/*.mjs; do
            node --check "$script"
          done

      - name: Test OAuth helper
        run: node --test scripts/mercadolivre-oauth.test.mjs

      - name: Checkstyle, Java tests, PostgreSQL integration and coverage
        run: sh mvnw --batch-mode --no-transfer-progress -Dpostgres=true clean verify

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/checkstyle-result.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Upload validated application
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: price-alert-bot-${{ github.sha }}
          path: target/price-alert-bot-0.1.0.jar
          if-no-files-found: error
          retention-days: 7
